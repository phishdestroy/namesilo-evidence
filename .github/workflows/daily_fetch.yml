name: Daily Fetch

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch new domains
        env:
          REGISTRAR_ID: "1479"
          NETAPI_TOKEN: ${{ secrets.NETAPI_TOKEN }}
        run: python scan/fetch_new.py
      - name: Commit and push
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/ stats/ ioc/ docs/ioc/ docs/chart-data.json README.md
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi
          AFTER=$(wc -l < data/all.txt 2>/dev/null || echo 0)
          NEW_COUNT=$(comm -13 <(git show HEAD:data/all.txt 2>/dev/null || true) data/all.txt 2>/dev/null | wc -l || echo 0)
          LATEST=$(ls data/new/$(date -u +%Y)/$(date -u +%m)/*.txt 2>/dev/null | tail -1 | xargs -I{} basename {} .txt || echo "unknown")
          git commit -m "daily fetch: $(date -u +%Y-%m-%d) — +${NEW_COUNT} new | latest: ${LATEST} | total: ${AFTER} [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
