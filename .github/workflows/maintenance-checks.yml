name: Maintenance checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Validation uses the renderer and IOC inputs, not the registration archive.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/
            /scan/
            /template/
            /docs/
            /ioc/
            /data/ioc/
            /site.config.json
            /README.md
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r template/requirements.txt
      - run: python -m compileall -q scan template/scripts
      - run: python -m unittest discover -s scan -p "test_*.py"
      - run: python template/scripts/refresh_sources.py --local
      - run: python template/scripts/verify.py
