# Daily NetAPI fetch (replaces .github/workflows/daily_fetch.yml; same steps) and
# GitLab Pages deployment. `fetch` runs from the pipeline schedule (or a manual
# "Run pipeline"); it pushes the update with the job token and hands the fresh
# docs/ to `pages` in the same pipeline.
stages: [fetch, deploy]

fetch:
  stage: fetch
  image: python:3.12
  variables:
    GIT_DEPTH: "1"
    REGISTRAR_ID: "1479"
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web"
  script:
    - python scan/fetch_new.py
    - python scan/build_feed_ioc.py
    - |
      git config user.email "bot@phishdestroy.io"
      git config user.name "PhishDestroy Bot"
      export LC_ALL=C
      git add data/ stats/ ioc/ docs/ioc/ docs/chart-data.json docs/feed-ioc.json README.md
      if git diff --staged --quiet; then
        echo "No changes"
        exit 0
      fi
      AFTER=$(wc -l < data/all.txt 2>/dev/null || echo 0)
      NEW_COUNT=$(comm -13 <(git show HEAD:data/all.txt 2>/dev/null || true) data/all.txt 2>/dev/null | wc -l || echo 0)
      LATEST=$(python3 -c "import json; print(json.load(open('stats/latest_reg.json'))['message'])" 2>/dev/null || echo "unknown")
      git commit -m "daily fetch: $(date -u +%Y-%m-%d) — +${NEW_COUNT} new | latest: ${LATEST} | total: ${AFTER}"
      REMOTE="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      for i in 1 2 3; do
        git push "$REMOTE" HEAD:main && exit 0
        git pull --rebase -X theirs "$REMOTE" main || true
        sleep $((i * 5))
      done
      exit 1
  artifacts:
    paths: [docs/, ioc/]
    expire_in: 1 day

# GitLab Pages — replaces the former GitHub Pages deployment.
pages:
  stage: deploy
  image: alpine:3.20
  variables:
    GIT_DEPTH: "1"
  needs:
    - job: fetch
      optional: true
  script:
    - rm -rf public && cp -r docs public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
